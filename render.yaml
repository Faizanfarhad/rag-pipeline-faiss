# render.yaml - RAG QA Service (Render Free Tier)
services:
  - type: web
    name: rag-faiss-service
    runtime: python
    region: oregon
    plan: free

    # Build: only install deps (model loads at runtime to save build RAM)
    buildCommand: pip install --no-cache-dir -r requirements.txt

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: RAG_DEVICE
        value: cpu
      - key: RAG_EMBED_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RAG_DOC_PATH
        value: docsContainer/text.md
      - key: RAG_TOP_K
        value: "3"
      - key: RAG_CHUNK_SIZE
        value: "128"
      - key: RAG_CHUNK_OVERLAP
        value: "20"

    healthCheckPath: /health