# render.yaml - RAG QA Service (Render Free Tier)
services:
  - type: web
    name: rag-faiss-service
    runtime: python
    region: oregon
    plan: free

    # Build: install deps first, THEN download model
    buildCommand: |
      pip install --no-cache-dir -r requirements.txt
      python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')"

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: RAG_DEVICE
        value: cpu
      - key: RAG_EMBED_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RAG_TOP_K
        value: "5"
      - key: RAG_CHUNK_SIZE
        value: "256"
      - key: RAG_CHUNK_OVERLAP
        value: "30"

    healthCheckPath: /health